<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Event Registration - EventHub</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<style>
body {
  background: #f8f9fa;
  font-family: "Poppins", sans-serif;
}
.card {
  border-radius: 15px;
  box-shadow: 0 5px 20px rgba(0,0,0,0.1);
}
.btn-register {
  background: linear-gradient(90deg, #007bff, #6610f2);
  border: none;
  color: white;
  transition: 0.3s;
}
.btn-register:hover {
  transform: scale(1.05);
  box-shadow: 0 0 10px rgba(0,0,0,0.3);
}
</style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand fw-bold" href="index.html">EventHub</a>
  </div>
</nav>

<section class="py-5">
  <div class="container">
    <h3 class="text-center mb-4"><i class="fa-solid fa-user-plus"></i> Register for Event</h3>

    <div class="card p-4 col-lg-6 mx-auto">
      <form id="registrationForm">
        <div class="mb-3">
          <label class="form-label">Full Name</label>
          <input type="text" id="name" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" id="email" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Phone</label>
          <input type="text" id="phone" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label">College</label>
          <input type="text" id="college" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Place / City</label>
          <input type="text" id="place" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Select Event</label>
          <select id="eventId" class="form-select" required>
            <option value="">-- Choose an Event --</option>
            <option value="1">Coding Challenge</option>
            <option value="2">Web Design Contest</option>
            <option value="3">Robotics Workshop</option>
            <option value="4">AI Hackathon</option>
            <option value="5">Quiz Competition</option>
          </select>
        </div>
        <div class="text-end">
          <button type="submit" class="btn btn-register">
            <i class="fa-solid fa-paper-plane"></i> Register
          </button>
        </div>
      </form>
      <div id="formMsg" class="mt-3 text-center fw-semibold"></div>
    </div>
  </div>
</section>

<footer class="bg-dark text-center text-white py-3 mt-5">
  <small>© 2025 EventHub. Built with ❤️ by the EventHub Team.</small>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
document.getElementById('registrationForm').addEventListener('submit', function(e) {
  e.preventDefault();

  const participant = {
    name: document.getElementById('name').value.trim(),
    email: document.getElementById('email').value.trim(),
    phone: document.getElementById('phone').value.trim(),
    college: document.getElementById('college').value.trim(),
    place: document.getElementById('place').value.trim(),
    eventId: document.getElementById('eventId').value,
    eventName: document.getElementById('eventId').selectedOptions[0].text
  };

  let participants = JSON.parse(localStorage.getItem('participants')) || [];

  // Check for duplicate email and event combination
  const alreadyRegistered = participants.some(p => 
    p.email === participant.email && p.eventId === participant.eventId
  );

  if (alreadyRegistered) {
    document.getElementById('formMsg').innerHTML = 
      '<div class="text-danger"><i class="fa-solid fa-triangle-exclamation"></i> You are already registered for this event!</div>';
    return;
  }

  participants.push(participant);
  localStorage.setItem('participants', JSON.stringify(participants));

  document.getElementById('formMsg').innerHTML = 
    '<div class="text-success"><i class="fa-solid fa-circle-check"></i> Registration successful!</div>';

  document.getElementById('registrationForm').reset();

  setTimeout(() => {
    window.location.href = 'participants.html';
  }, 1200);
});
</script>
</body>
</html>
